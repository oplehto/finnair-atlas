<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Airline Atlas — a living timetable</title><link rel="stylesheet" href="/fonts.css"><link rel="stylesheet" href="/style.css"></head><body>
<main>
<div class="sheet-wrap" id="viewport" tabindex="0" aria-label="Flight map. Drag to pan, scroll to zoom, or use arrow keys to pan."><div id="diagram"></div><p id="empty" hidden>No flights match. Try another date or clear the filters.</p></div>
<details class="widget controls" open><summary><span class="brand">Airline Atlas</span><span class="fold">Filters & source</span></summary><div class="widget-body"><p class="edition">Domestic services</p><h1 id="title">Finland, by air</h1>
<section class="toolbar" aria-label="Timetable controls"><label>Departure date<select id="date"></select></label><label>Find a flight or airport<input id="query" type="search" placeholder="HEL, OUL or AY300"></label><label>Aircraft<select id="aircraft"><option value="">All aircraft</option></select></label><label class="codeshare-label"><input type="checkbox" id="show-codeshares" checked> Partner codeshares (Qatar & Qantas)</label></section>
<div class="source"><strong id="source">Loading schedule…</strong><span id="updated"></span></div><div class="actions"><button id="refresh">Refresh</button><button id="import">Import</button><button id="export">Export SVG</button></div><input type="file" id="file" accept=".json,application/json" hidden></div></details>
<details class="widget services"><summary>Flight timetable <span id="count"></span></summary><aside class="widget-body"><div class="aside-heading"><h2>Flight details</h2><button id="clear" hidden>Clear</button></div><div id="detail"></div><h3 id="list-title">Services on this sheet</h3><div id="flights"></div></aside></details>
<div id="message" role="status" hidden></div>
<div class="widget zoom" aria-label="Map zoom"><button id="minus" aria-label="Zoom out">−</button><output id="scale">80%</output><button id="plus" aria-label="Zoom in" title="Zoom in">+ Zoom in</button><button id="actual" title="Show at full size">100%</button><button id="fit">Fit</button></div>
<footer><span>Drag to pan · Scroll to zoom · Times local</span><span id="layout-note"></span><span>Arrow: arrival · Dashed: turboprop</span></footer>
</main><script type="module" src="/app.mjs"></script></body></html>
